[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tgju-collector"
version = "0.5.0"
description = "Section-aware market data collector for TGJU.org"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ali Sadeghi Aghili" }]
dependencies = [
    "requests>=2.31,<3",
    "lxml>=4.9,<6",
    "beautifulsoup4>=4.12,<5",
    "pandas>=2.0,<3",
    "jdatetime>=4.1,<5",
    "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
mssql = ["pyodbc>=5.0"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.scripts]
tgju = "tgju_collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
